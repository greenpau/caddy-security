name: build

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  selection:
    name: Plan parallel validation
    # The release script pushes main and its tag together; release.yml tests the tag.
    if: >-
      ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' ||
          !startsWith(github.event.head_commit.message, 'ops: released v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve shared artifact identity
        id: artifact
        run: make artifact-id
  quality:
    name: Repository quality gates
    needs: selection
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-${{ runner.arch }}-1.26.10-
      - name: Cache Go builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-quality-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-quality-${{ hashFiles('go.sum') }}-
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-quality-
      - name: Install pinned tools and module dependencies
        run: make dep
      - name: Run repository quality gates
        id: tests
        run: make ci-quality
      - name: Verify validation did not modify source
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
  prepare:
    name: Prepare shared Go builds
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    needs: selection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
      TEST_MEMORY_MB: '6144'
      TEST_GO_MEMORY_MB: '1024'
      TEST_GOMAXPROCS: '4'
      TEST_PACKAGE_PARALLELISM: '2'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-${{ runner.arch }}-1.26.10-
      - name: Cache prepared Go builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-prepared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-prepared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ hashFiles('go.sum') }}-
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-root-
      - name: Download and verify module dependencies
        run: |
          go mod download
          go mod verify
      - name: Compile shared test and fixture builds without running tests
        id: prepare
        run: make ci-prepare
      - name: Select complete matrix and browser prerequisites
        id: shards
        run: |
          matrix=$(python3 assets/scripts/ci_tests.py matrix --inventory .coverage/prepare/tests.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Verify preparation did not modify source
        if: ${{ always() && steps.prepare.outcome != 'skipped' }}
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload preparation evidence
        if: ${{ always() && steps.prepare.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caddy-security_preparation_${{ needs.selection.outputs.artifact_id }}
          path: .coverage/prepare/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  go:
    name: Go tests (${{ matrix.shard }})
    # Do not start any shard unless all repository quality gates pass.
    needs: [selection, quality, prepare]
    runs-on: ubuntu-24.04
    # Keep setup, inventory, reports and upload outside the 70-minute test guard.
    timeout-minutes: 85
    strategy:
      # Preserve every shard's evidence if one fails.
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
      # CI runners have 4 CPUs and 16 GB RAM. Keep laptop defaults in Make.
      TEST_MEMORY_MB: '6144'
      TEST_GO_MEMORY_MB: '1024'
      TEST_GOMAXPROCS: '4'
      TEST_PACKAGE_PARALLELISM: '2'
      TEST_PARALLELISM: '4'
      TEST_TIMEOUT: '60m'
      TEST_WALL_TIMEOUT: '4200'
      TEST_MAX_PROCESSES: '256'
      TEST_ARTIFACT_MB: '512'
      CI_SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-${{ runner.arch }}-1.26.10-
      - name: Cache Go builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ matrix.shard }}-
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ matrix.cache_group }}-${{ hashFiles('go.sum') }}-
            go-build-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ matrix.cache_group }}-
      - name: Restore shared prepared Go builds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-prepared-v1-${{ runner.os }}-${{ runner.arch }}-1.26.10-${{ hashFiles('go.sum') }}-${{ github.sha }}
      - name: Set up Node.js for browser E2E
        if: ${{ matrix.browser }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install browser prerequisites
        if: ${{ matrix.browser }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes libnss3-tools
          google-chrome --version
      - name: Download and verify module dependencies
        run: |
          go mod download
          go mod verify
      - name: Run Go test shard
        id: tests
        run: make ci-test-shard
      - name: Summarize timings and resource use
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: python3 assets/scripts/ci_tests.py summarize "$CI_SHARD"
      - name: Verify validation did not modify source
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload shard evidence
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caddy-security_coverage_${{ needs.selection.outputs.artifact_id }}_shard_${{ matrix.shard }}
          path: .coverage/shards/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          overwrite: true
  core:
    # Preserve the existing branch-protection and reusable release check.
    name: Tests and coverage
    needs: [selection, quality, prepare, go]
    if: ${{ !cancelled() && needs.selection.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download shard evidence
        id: download
        if: ${{ needs.selection.result == 'success' && needs.go.result != 'skipped' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: caddy-security_coverage_${{ needs.selection.outputs.artifact_id }}_shard_*
          path: .coverage/shards/
          merge-multiple: true
      - name: Require complete validation
        if: ${{ always() }}
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          GO_RESULT: ${{ needs.go.result }}
        run: python3 assets/scripts/ci_tests.py gate
      - name: Verify complete execution and combine coverage
        run: python3 assets/scripts/ci_tests.py merge
      - name: Upload complete test and coverage bundle
        if: ${{ always() && steps.download.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caddy-security_coverage_${{ needs.selection.outputs.artifact_id }}
          path: .coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          overwrite: true
