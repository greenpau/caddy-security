name: build

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  core:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.8'
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes make libnss3-tools python3
      - name: Resolve versioned artifact identity
        id: artifact
        run: make artifact-id
      - name: Install pinned test tool and module dependencies
        run: make dep
      - name: Run repository quality gates
        id: tests
        run: make ci-check
      - name: Verify validation did not modify source
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Upload test and coverage bundle
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caddy-security_coverage_${{ steps.artifact.outputs.artifact_id }}
          path: .coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
