name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual triggering from the Actions tab

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/build.yml
  goreleaser:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.8'
      - name: Verify release version and annotated tag
        run: |
          test "$GITHUB_REF_TYPE" = tag
          python3 assets/scripts/version.py check --tag "$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
      - name: Generate go-authcrunch changelog
        shell: bash
        run: |
          changelog_file="${RUNNER_TEMP}/go-authcrunch-changelog.md"
          assets/scripts/generate_go_authcrunch_changelog.sh > "${changelog_file}"
          {
            echo "GO_AUTHCRUNCH_CHANGELOG<<GO_AUTHCRUNCH_CHANGELOG_EOF"
            cat "${changelog_file}"
            echo "GO_AUTHCRUNCH_CHANGELOG_EOF"
          } >> "${GITHUB_ENV}"
      - uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean --timeout 60m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOPATH: /home/runner/go
