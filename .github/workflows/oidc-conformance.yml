name: OIDC conformance

on:
  workflow_dispatch:
    inputs:
      evidence_recipient:
        description: 'age public key for private evidence (defaults to repository variable OIDC_CONFORMANCE_AGE_RECIPIENT)'
        required: false
        type: string

permissions:
  contents: read

# Preserve a running rehearsal and its evidence when another is dispatched.
concurrency:
  group: oidc-conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    name: Official Basic, Config and Form Post OP plans
    runs-on: ubuntu-24.04
    # Keep setup, cancellation cleanup, encryption and upload outside stage limits.
    timeout-minutes: 120
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
      OIDC_CONFORMANCE_AGE_RECIPIENT: ${{ inputs.evidence_recipient || vars.OIDC_CONFORMANCE_AGE_RECIPIENT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize private evidence and check recipient format
        id: initialize
        run: python3 assets/scripts/oidc_conformance_ci.py initialize
      - name: Set up Go
        id: go
        timeout-minutes: 5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.8'
      - name: Install host runtime libraries
        id: prerequisites
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --yes make openssl python3-venv apparmor libnss3-tools libgtk-3-0t64 libasound2t64 libgbm1 libssl3t64
      - name: Build pinned evidence encryption tools
        id: tools
        env:
          GOBIN: ${{ github.workspace }}/tmp/oidc-conformance/tools/age
          GOMODCACHE: ${{ github.workspace }}/tmp/oidc-conformance/tools/age-modcache
          GOCACHE: ${{ github.workspace }}/tmp/oidc-conformance/tools/age-buildcache
        run: |
          python3 assets/scripts/oidc_conformance_ci.py stage --timeout 300 tools -- \
            go install filippo.io/age/cmd/age@v1.2.1 filippo.io/age/cmd/age-keygen@v1.2.1
      - name: Validate encryption recipient
        id: recipient
        run: python3 assets/scripts/oidc_conformance_ci.py check-recipient
      - name: Prepare pinned official suite and headless Chrome
        id: prepare
        run: |
          python3 assets/scripts/oidc_conformance_ci.py stage --timeout 1800 prepare -- \
            make oidc-conformance-prepare
      - name: Allow the pinned Chrome binary to use its sandbox
        id: sandbox
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ] && \
             [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" != 0 ]; then
            # Scope the Ubuntu 24.04 userns permission to this executable.
            # Keep the browser sandbox and host-wide AppArmor restrictions enabled.
            umask 077
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile oidc-conformance-chrome "%s" flags=(unconfined) {\n  userns,\n}\n' \
              "$GITHUB_WORKSPACE/tmp/oidc-conformance/tools/chrome/chrome" \
              > tmp/oidc-conformance-ci/private/chrome-apparmor.profile
            sudo apparmor_parser -r tmp/oidc-conformance-ci/private/chrome-apparmor.profile
          fi
      - name: Run actual Caddy conformance deployment
        id: test
        run: |
          python3 assets/scripts/oidc_conformance_ci.py stage --timeout 2700 test -- \
            make oidc-conformance-test CONFORMANCE_RESULTS=tmp/oidc-conformance-ci/private/evidence
      - name: Generate HTML summary and encrypt full evidence
        if: ${{ always() }}
        timeout-minutes: 10
        env:
          OIDC_CI_INITIALIZE: ${{ steps.initialize.outcome }}
          OIDC_CI_GO: ${{ steps.go.outcome }}
          OIDC_CI_PREREQUISITES: ${{ steps.prerequisites.outcome }}
          OIDC_CI_TOOLS: ${{ steps.tools.outcome }}
          OIDC_CI_RECIPIENT: ${{ steps.recipient.outcome }}
          OIDC_CI_PREPARE: ${{ steps.prepare.outcome }}
          OIDC_CI_SANDBOX: ${{ steps.sandbox.outcome }}
          OIDC_CI_TEST: ${{ steps.test.outcome }}
        run: python3 assets/scripts/oidc_conformance_ci.py package
      - name: Upload OIDC report artifact
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oidc-conformance_${{ github.run_id }}_${{ github.run_attempt }}
          path: tmp/oidc-conformance-ci/artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Unload the owned Chrome AppArmor profile
        if: ${{ always() }}
        run: |
          if [ -f tmp/oidc-conformance-ci/private/chrome-apparmor.profile ]; then
            sudo apparmor_parser -R tmp/oidc-conformance-ci/private/chrome-apparmor.profile
          fi
