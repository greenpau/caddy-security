name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '35 11 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript, python, actions]
    env:
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.8'
      - name: Initialize Go analysis
        id: init-go
        if: matrix.language == 'go'
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: go
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
      - name: Initialize other language analysis
        id: init-other
        if: matrix.language != 'go'
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build Go code
        if: matrix.language == 'go'
        run: go build -mod=readonly ./...
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
          output: .coverage/codeql-analysis
          upload: false
      - name: Verify scan retains expected alerts
        env:
          CODEQL: ${{ steps.init-go.outputs.codeql-path || steps.init-other.outputs.codeql-path }}
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: make test-codeql
      - name: Apply approved alert suppressions
        run: |
          python3 assets/scripts/filter_codeql_results.py \
            --input .coverage/codeql-analysis --output-dir .coverage/codeql-reviewed
      - name: Upload verified analysis
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: .coverage/codeql-reviewed
          category: /language:${{ matrix.language }}
      - name: Preserve analysis and regression evidence
        if: ${{ always() && steps.analyze.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .coverage/codeql-analysis/
            .coverage/codeql-reviewed/
            .coverage/codeql/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
